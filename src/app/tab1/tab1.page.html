<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="profile-container">

    <!-- Avatar y saludo principal -->
    <div class="avatar-box">
      <ion-icon name="person-circle" class="profile-avatar-icon"></ion-icon>
      <h1 class="welcome-title">¡Bienvenido!</h1>
      <h2 class="user-display-name">{{ displayName }}</h2>
      <p class="user-handle">&#64;{{ username }}</p>
    </div>

    <!-- Tarjeta con información del usuario -->
    <ion-card class="info-card">
      <ion-card-header>
        <ion-card-title>Información de la Cuenta</ion-card-title>
        <ion-card-subtitle>Datos registrados en el sistema</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="inset">
          
          <ion-item *ngIf="user?.fname">
            <ion-icon slot="start" name="person" color="primary"></ion-icon>
            <ion-label>
              <h3>Nombre</h3>
              <p>{{ user.fname }}</p>
            </ion-label>
          </ion-item>

          <ion-item *ngIf="user?.lname">
            <ion-icon slot="start" name="person" color="primary"></ion-icon>
            <ion-label>
              <h3>Apellido(s)</h3>
              <p>{{ user.lname }}</p>
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="mail" color="primary"></ion-icon>
            <ion-label>
              <h3>Correo Electrónico</h3>
              <p>{{ user?.email || 'Sin correo' }}</p>
            </ion-label>
          </ion-item>

        </ion-list>
      </ion-card-content>
    </ion-card>

    <!-- Botones de Acción -->
    <div class="actions-box">
      <ion-button expand="block" (click)="goToGallery()" class="action-btn">
        <ion-icon slot="start" name="camera"></ion-icon>
        Ver Galería de Fotos
      </ion-button>

      <ion-button expand="block" fill="outline" color="danger" (click)="logout()" class="action-btn">
        <ion-icon slot="start" name="log-out"></ion-icon>
        Cerrar Sesión
      </ion-button>
    </div>

  </div>
</ion-content>
